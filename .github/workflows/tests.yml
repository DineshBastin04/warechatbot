name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    # Windows to match the deployment (ODBC Driver 17, Waitress on Windows).
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: chat_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_engine/requirements.txt
            chat_engine/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # The suite uses fakes only: no SQL Server, LLM, mail server or network.
        run: python -m pytest tests -q
