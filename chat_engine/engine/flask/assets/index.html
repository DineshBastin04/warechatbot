  <body class="bg-white dark:bg-slate-900">
    <div id="app"></div>

    <!-- Collapsed by default: previously an always-visible box pinned over the
         header (top:6px;right:5px), which visually collided with the page
         title. Now a small fixed toggle in the bottom-right corner that opens
         a compact panel with the same two controls — same functionality
         (voice input language + auto-stop silence duration), just out of the
         header's way. -->
    <div id="vanna-language-selector" style="position:fixed;bottom:20px;right:20px;z-index:9999;">
  <button type="button" id="voice-settings-toggle" title="Voice input settings"
    style="width:38px;height:38px;border-radius:50%;border:none;background:#4f46e5;color:#fff;font-size:16px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.25);">🎤</button>
  <div id="voice-settings-panel" style="display:none;position:absolute;bottom:46px;right:0;background:#fff;border:1px solid #e2e2e2;padding:10px 12px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.18);white-space:nowrap;">
  <label>🎤 Voice:</label>
  <select id="voice-language-select">
    <option value="en-US">🇺🇸 English</option>
    <option value="es-ES">🇪🇸 Español</option>
    <option value="fr-FR">🇫🇷 Français</option>
    <option value="hi-IN">🇮🇳 हिन्दी</option>
    <option value="es-MX">🇲🇽 Español (México)</option>
    <option value="pt-PT">🇵🇹 Português</option>
    <option value="ar-SA">🇸🇦 العربية</option>
    <option value="ja-JP">🇯🇵 日本語</option>
  </select>


  <label style="margin-left:15px; display:none;">⏱️ Auto-stop:</label>
  <select id="voice-silence-select">
    <option value="1500">1.5 sec silence</option>
    <option value="2000">2 sec silence</option>
    <option value="3000">3 sec silence</option>
    <option value="5000">5 sec silence</option>
  </select>
  </div>
</div>

<script>

//tanslate
(function() {
    const select = document.getElementById('voice-language-select');
    const silenceSelect = document.getElementById('voice-silence-select');
    const toggleBtn = document.getElementById('voice-settings-toggle');
    const panel = document.getElementById('voice-settings-panel');

    toggleBtn.addEventListener('click', (evt) => {
        evt.stopPropagation();
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', (evt) => {
        if (panel.style.display !== 'none' && !panel.contains(evt.target) && evt.target !== toggleBtn) {
            panel.style.display = 'none';
        }
    });

    select.value = localStorage.getItem('vanna-voice-lang') || 'en-US';
    silenceSelect.value = localStorage.getItem('vanna-voice-silence') || '2000';

    select.onchange = () => localStorage.setItem('vanna-voice-lang', select.value);
    silenceSelect.onchange = () => localStorage.setItem('vanna-voice-silence', silenceSelect.value);

    const Original = window.webkitSpeechRecognition || window.SpeechRecognition;

    if (Original) {
        const OriginalProto = Original.prototype;
        const originalStart = OriginalProto.start;
       
        OriginalProto.start = function() {
            // Set language before starting
            this.lang = select.value;
            this.continuous = true;
            this.interimResults = true;
           
            let silenceTimer;
            const silenceDuration = parseInt(silenceSelect.value);
           
            // Reset timer when speech is detected
            const resetTimer = () => {
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    try { this.stop(); } catch(e) {}
                }, silenceDuration);
            };
           
            // Listen for speech results
            this.addEventListener('result', resetTimer);
            this.addEventListener('start', resetTimer);
           
            // Clean up on end
            this.addEventListener('end', () => {
                clearTimeout(silenceTimer);
            }, { once: true });
           
            return originalStart.call(this);
        };
    }
    })();

    //redirect to new page
    function redirectToPrediction() {
        const workspace_id = getWorkspaceIdFromUrl();
        console.log("Redirecting with workspace_id:", workspace_id);
        window.open(`/prediction-page?workspace_id=${encodeURIComponent(workspace_id)}`, '_blank');
    }
    //redirect to new page
    function redirectToAnomaly() {
        const workspace_id = getWorkspaceIdFromUrl();
        console.log("Redirecting with workspace_id:", workspace_id);
        window.open(`/anomaly-page?workspace_id=${encodeURIComponent(workspace_id)}`, '_blank');
    }

     // Function to get workspace_id from URL
    function getWorkspaceIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get("workspace_id") || "unknown";
    }

    // Function to format prediction type for display
    function formatPredictionType(type) {
        return type
            .split("_")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
    }

    // Function to open the popup (modal)
    async function openPopup() {
        const workspace_id = getWorkspaceIdFromUrl();
        const modal = document.getElementById("predictionModal");
        const workspaceIdDisplay = document.getElementById("workspaceIdDisplay");
        const predictionButtons = document.getElementById("predictionButtons");

        if (!modal || !workspaceIdDisplay || !predictionButtons) {
            console.error("Modal, workspace ID display, or prediction buttons element not found.");
            return;
        }

        // Set workspace ID display
        const displayId = workspace_id.length > 8 ? `${workspace_id.slice(0, 6)}...` : workspace_id;
        workspaceIdDisplay.textContent = `Workspace: ${displayId}`;

        // Show loading state for buttons
        predictionButtons.innerHTML = '<p class="loading">Loading predictions...</p>';

        try {
            // Fetch prediction configurations
            const response = await fetch(`/api/v0/get_prediction_configs?workspace_id=${encodeURIComponent(workspace_id)}`);
            const data = await response.json();

            if (data.type === "error") {
                predictionButtons.innerHTML = `<p class="error">Error: ${data.error}</p>`;
                return;
            }

            const predictions = data.predictions || [];
            predictionButtons.innerHTML = ""; // Clear loading state

            if (predictions.length === 0) {
                predictionButtons.innerHTML = "<p>No predictions available.</p>";
            } else {
                // Add buttons for enabled predictions
                predictions.forEach(prediction => {
                    if (prediction.enabled) {
                        const button = document.createElement("button");
                        button.className = "prediction-btn";
                        button.textContent = formatPredictionType(prediction.type);
                        button.onclick = () => fetchPrediction(prediction.type);
                        predictionButtons.appendChild(button);
                    }
                });
            }
        } catch (error) {
            predictionButtons.innerHTML = `<p class="error">Failed to load predictions: ${error.message}</p>`;
        }

        // Show the modal
        modal.style.display = "flex";
    }

    // Function to close the popup (modal)
    function closePopup() {
        const modal = document.getElementById("predictionModal");
        if (modal) {
            modal.style.display = "none";
        }
    }

    // Function to fetch prediction data and display in a table
    async function fetchPrediction(prediction_type) {
        const workspace_id = getWorkspaceIdFromUrl();
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = '<p class="loading">Loading...</p>';

        try {
            const response = await fetch(`/api/v0/run_prediction?workspace_id=${encodeURIComponent(workspace_id)}&prediction_type=${encodeURIComponent(prediction_type)}`);
            const data = await response.json();

            if (data.type === "error" || data.type === "sql_error") {
                resultDiv.innerHTML = `<p class="error">Error: ${data.error}</p>`;
                return;
            }

            if (data.df && data.df.length > 0) {
                const table = document.createElement("table");
                const thead = document.createElement("thead");
                const tbody = document.createElement("tbody");

                // Create table headers
                const headers = Object.keys(data.df[0]);
                const headerRow = document.createElement("tr");
                headers.forEach(header => {
                    const th = document.createElement("th");
                    th.textContent = header.replace("_", " ").toUpperCase();
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);

                // Create table rows
                data.df.forEach(row => {
                    const tr = document.createElement("tr");
                    headers.forEach(header => {
                        const td = document.createElement("td");
                        td.textContent = row[header] ?? "NULL";
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                table.appendChild(thead);
                table.appendChild(tbody);
                resultDiv.innerHTML = "";
                resultDiv.appendChild(table);
            } else {
                resultDiv.innerHTML = "<p>No data available.</p>";
            }
        } catch (error) {
            resultDiv.innerHTML = `<p class="error">Failed to fetch prediction: ${error.message}</p>`;
        }
    }

    // Optional: Close modal when clicking outside the modal content
    document.addEventListener("click", function (event) {
        const modal = document.getElementById("predictionModal");
        const modalContent = document.querySelector(".modal-content");
        if (modal && event.target === modal && modal.style.display === "flex") {
            closePopup();
        }
    });



    function hideTargetButtons() {
        document.querySelectorAll('button').forEach(btn => {
            const text = (btn.innerText || btn.textContent || '').trim();
            if (['Edit Question', 'New Question', 'Add New Question'].includes(text)) {
                const li = btn.closest('li');
                if (li) li.style.display = 'none';
            }
        });
    }

    // Run now
    hideTargetButtons();

    // Watch for future additions (e.g., Svelte re-renders)
    const observer = new MutationObserver(hideTargetButtons);
    observer.observe(document.body, { childList: true, subtree: true });



</script>


<script>
  window.showToast = function (message, type = "success") {
    Toastify({
      text: message,
      duration: 3000,
      gravity: "top",
      position: "center",
      close: true,
      stopOnFocus: true,
      style: {
        background:
          type === "success"
            ? "#22c55e"   // green
            : "#ef4444",  // red
      },
    }).showToast();
  };
</script>


<script>
  // Override default alert behavior globally
  window.alert = function (message) {
    const text = String(message || "");

    // Heuristic mapping
    if (
      text.toLowerCase().includes("thank") ||
      text.toLowerCase().includes("saved")
    ) {
      showToast(text, "success");
    } else {
      showToast(text, "error");
    }
  };
</script>
