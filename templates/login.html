<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAI Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Roboto", sans-serif;
    }
    body {
      background: linear-gradient(to right, #e2e2e2, #c9d6ff);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; height: 100vh;
    }
    .container {
      background-color: #fff;
      border-radius: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
      position: relative; overflow: hidden;
      width: 768px; max-width: 100%; min-height: 480px;
    }
    .container p { font-size: 14px; line-height: 20px; letter-spacing: 0.3px; margin: 20px 0; }
    .container span { font-size: 12px; }
    .container a { color: #333; font-size: 13px; text-decoration: none; margin: 15px 0 10px; }
    .container button {
      background-color: #2da0a8; color: #fff; font-size: 12px;
      padding: 10px 45px; border: 1px solid transparent; border-radius: 8px;
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
      margin-top: 10px; cursor: pointer;
    }
    .container button.hidden { background-color: transparent; border-color: #fff; }
    .container form {
      background-color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; padding: 0 40px; height: 100%;
    }
    .container input {
      background-color: #eee; border: none; margin: 8px 0;
      padding: 10px 15px; font-size: 13px; border-radius: 8px;
      width: 100%; outline: none;
    }
    .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }
    .sign-in { left: 0; width: 50%; z-index: 2; }
    .container.active .sign-in { transform: translateX(100%); }
    .sign-up { left: 0; width: 50%; opacity: 0; z-index: 1; }
    .container.active .sign-up {
      transform: translateX(100%); opacity: 1; z-index: 5; animation: move 0.6s;
    }
    @keyframes move {
      0%, 49.99% { opacity: 0; z-index: 1; }
      50%, 100% { opacity: 1; z-index: 5; }
    }
    .social-icons { margin: 20px 0; }
    .social-icons a {
      border: 1px solid #ccc; border-radius: 20%;
      display: inline-flex; justify-content: center; align-items: center;
      margin: 0 3px; width: 40px; height: 40px; color: #333;
    }
    .toggle-container {
      position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
      overflow: hidden; transition: all 0.6s ease-in-out;
      border-radius: 150px 0 0 100px; z-index: 1000;
    }
    .container.active .toggle-container {
      transform: translateX(-100%);
      border-radius: 0 150px 100px 0;
    }
    .toggle {
      background: linear-gradient(to right, #5c6bc0, #2da0a8);
      color: #fff; position: relative; left: -100%;
      height: 100%; width: 200%; transform: translateX(0);
      transition: all 0.6s ease-in-out;
    }
    .container.active .toggle { transform: translateX(50%); }
    .toggle-panel {
      position: absolute; width: 50%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; padding: 0 30px; text-align: center;
      top: 0; transform: translateX(0); transition: all 0.6s ease-in-out;
    }
    .toggle-left { transform: translateX(-200%); }
    .container.active .toggle-left { transform: translateX(0); }
    .toggle-right { right: 0; transform: translateX(0); }
    .container.active .toggle-right { transform: translateX(200%); }
    h1 { margin-bottom: 10px; }
    .warehouse-theme {
        color: #000;
        font-weight: 700;
    }

    h1.warehouse-theme .small-ai {
        font-size: 0.9em !important; /* Increased specificity and !important */
        font-weight: 600;
        vertical-align: baseline;
        margin-left: -4px;
        color: #000;
    }

    .login-copyright{
        margin-top: 20px;
    }

     @media only screen and (min-width: 768px) and (max-width: 1024px){
     .container{
	    width: 730px;
		}
}

  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="form-container sign-up">
    <!-- Dummy form - no backend route -->
    <form method="POST" action="#">
        <h1 class="warehouse-theme">
            ∞ Tychons <span class="small-ai">wi</span>
        </h1>
        <input type="text" placeholder="Username" disabled />
        <input type="email" placeholder="Email" disabled />
        <input type="password" placeholder="Password" disabled />
        <button type="button" disabled>Sign Up</button>
    </form>
    </div>
    <!-- Sign In -->
    <div class="form-container sign-in">
      <form method="POST" action="{{ url_for('login') }}">
        <h1 class="warehouse-theme">
            ∞ Tychons <span class="small-ai">wi</span>
        </h1>


        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
        {% if error %}<p style="color:red; font-size:12px;">{{ error }}</p>{% endif %}
      </form>
    </div>
    <!-- Toggle Panels -->
    <div class="toggle-container">
      <div class="toggle">
        <div class="toggle-panel toggle-left">
          <h1>Welcome Back!</h1>
          <button class="hidden" id="login">Sign In</button>
        </div>
        <div class="toggle-panel toggle-right">
          <h1>Hello Warehouse</h1>
          <h3>Just Ask !!!</h3>
          <button class="hidden" id="register">Sign Up</button>
        </div>
      </div>
    </div>
  </div>
       <footer>
        <div class="login-copyright">
            <p>© 2025 Tychons USA LLC. All Rights Reserved</p>
        </div>
      </footer>
  <script>
    const container = document.getElementById("container");
    const registerBtn = document.getElementById("register");
    const loginBtn = document.getElementById("login");
    registerBtn.addEventListener("click", () => container.classList.add("active"));
    loginBtn.addEventListener("click", () => container.classList.remove("active"));
  </script>
</body>
</html>
